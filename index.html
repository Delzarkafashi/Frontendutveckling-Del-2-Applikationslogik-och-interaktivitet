<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>

  <body>
    <div class="game-wrapper">
      <h1>Snake</h1>

      <section class="scoreboard">
        <h2>Top 5</h2>
        <ol id="scoreboard-list"></ol>
      </section>

    <section id="hud" class="hud">
      <div class="hud-player" id="hud-p1">
        <p class="hud-label">P1</p>
        <p class="hud-score">Score: <span id="p1-score">0</span></p>
      </div>

      <div class="hud-status">
        <p id="game-status">Redo</p>
        <p id="match-result" class="hud-result" style="display:none;"></p>
      </div>

      <div class="hud-player" id="hud-p2" style="display:none;">
        <p class="hud-label">P2</p>
        <p class="hud-score">Score: <span id="p2-score">0</span></p>
      </div>
    </section>


      <canvas id="game" width="600" height="600"></canvas>
    </div>

    <div id="start-screen" class="overlay">
      <div class="modal">
        <button id="start-btn" type="button">Spela singleplayer</button>
        <button id="multi-btn">Spela multiplayer</button>
        <button id="online-btn">Spela multiplayer online</button>
      </div>
    </div>

    <div id="pause-screen" class="overlay" style="display:none;">
      <div class="modal">
        <h2>Paus</h2>
        <p>Tryck <strong>Escape</strong> eller <strong>P</strong> för att fortsätta.</p>

        <div style="display:grid; gap:12px; margin-top:16px;">
          <button id="resume-btn" type="button">Fortsätt</button>
          <button id="pause-restart-btn" type="button">Starta om</button>
          <button id="quit-btn" type="button">Till start</button>
        </div>
      </div>
    </div>

    <div id="gameover-screen" class="overlay" style="display:none;">
      <div class="modal">
        <h2>Game Over</h2>
        <p id="gameover-result">Game Over!</p>
        <input id="player-name" type="text" placeholder="Ditt namn" />
        <button id="restart-btn" type="button">Starta om</button>
        <button id="gameover-back-btn" type="button">← Tillbaka</button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
